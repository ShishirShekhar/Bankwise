name: Production Deployment

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: bankwise-production
  cancel-in-progress: false

jobs:
  # -----------------------------------------------
  # Load shared production configuration
  # -----------------------------------------------
  production-config:
    name: Load production configuration
    runs-on: ubuntu-latest

    outputs:
      gcp_project_id: ${{ steps.config.outputs.project_id }}
      firebase_project_id: ${{ steps.config.outputs.firebase_project_id }}
      region: ${{ steps.config.outputs.region }}
      service_name: ${{ steps.config.outputs.service_name }}
      artifact_registry_repository: ${{ steps.config.outputs.artifact_registry_repository }}
      gemini_model: ${{ steps.config.outputs.gemini_model }}
      google_genai_use_vertexai: ${{ steps.config.outputs.google_genai_use_vertexai }}
      google_cloud_location: ${{ steps.config.outputs.google_cloud_location }}
      bigquery_dataset: ${{ steps.config.outputs.bigquery_dataset }}
      bigquery_location: ${{ steps.config.outputs.bigquery_location }}
      firestore_database: ${{ steps.config.outputs.firestore_database }}
      firestore_collection: ${{ steps.config.outputs.firestore_collection }}
      source_max_age_days: ${{ steps.config.outputs.source_max_age_days }}
      ask_rate_limit: ${{ steps.config.outputs.ask_rate_limit }}
      ask_rate_window_seconds: ${{ steps.config.outputs.ask_rate_window_seconds }}
      log_level: ${{ steps.config.outputs.log_level }}
      auth_cookie_secure: ${{ steps.config.outputs.auth_cookie_secure }}
      auth_cookie_samesite: ${{ steps.config.outputs.auth_cookie_samesite }}
      cors_origins: ${{ steps.config.outputs.cors_origins }}
      deploy_service_account_email: ${{ steps.accounts.outputs.deploy_service_account_email }}
      runtime_service_account_email: ${{ steps.accounts.outputs.runtime_service_account_email }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load production configuration
        id: config
        uses: ./.github/actions/get-env-values
        with:
          environment: production

      - name: Derive service account emails
        id: accounts
        uses: ./.github/actions/derive-service-accounts
        with:
          project_id: ${{ steps.config.outputs.project_id }}
          deploy_service_account_name: ${{ steps.config.outputs.deploy_service_account_name }}
          runtime_service_account_name: ${{ steps.config.outputs.runtime_service_account_name }}

  # -----------------------------------------------
  # 1. Backend CI
  # -----------------------------------------------
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend.yaml

  # -----------------------------------------------
  # 2. Frontend CI
  # -----------------------------------------------
  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend.yaml
    with:
      skip_build: true

  # -----------------------------------------------
  # 3. Build and push backend image
  # -----------------------------------------------
  build-backend:
    name: Build and push backend image
    needs:
      - backend-ci
      - frontend-ci
      - production-config

    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ needs.production-config.outputs.deploy_service_account_email }}
          project_id: ${{ needs.production-config.outputs.gcp_project_id }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        env:
          REGION: ${{ needs.production-config.outputs.region }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        env:
          PROJECT_ID: ${{ needs.production-config.outputs.gcp_project_id }}
          REGION: ${{ needs.production-config.outputs.region }}
          REPOSITORY: ${{ needs.production-config.outputs.artifact_registry_repository }}
          SERVICE: ${{ needs.production-config.outputs.service_name }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"

          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE" \
            backend

          docker push "$IMAGE"

  # -----------------------------------------------
  # 4. Build frontend static export
  # -----------------------------------------------
  frontend-production-build:
    name: Production frontend build
    needs:
      - build-backend
      - production-config

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate Firebase web configuration
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY" || {
            echo "Missing NEXT_PUBLIC_FIREBASE_API_KEY"
            exit 1
          }

          test -n "$NEXT_PUBLIC_FIREBASE_APP_ID" || {
            echo "Missing NEXT_PUBLIC_FIREBASE_APP_ID"
            exit 1
          }

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ needs.production-config.outputs.firebase_project_id }}.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ needs.production-config.outputs.firebase_project_id }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Keep API requests same-origin so Firebase Hosting applies its /api rewrite.
          NEXT_PUBLIC_BANKWISE_API_URL: ""

      - name: Upload static frontend build
        uses: actions/upload-artifact@v4
        with:
          name: bankwise-frontend-static
          path: frontend/out/
          if-no-files-found: error
          retention-days: 1

  # -----------------------------------------------
  # 5. Deploy backend to Cloud Run
  # -----------------------------------------------
  deploy-backend:
    name: Deploy Backend to Cloud Run
    needs:
      - build-backend
      - frontend-production-build
      - production-config

    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ needs.production-config.outputs.deploy_service_account_email }}
          project_id: ${{ needs.production-config.outputs.gcp_project_id }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ needs.production-config.outputs.service_name }}
          project_id: ${{ needs.production-config.outputs.gcp_project_id }}
          region: ${{ needs.production-config.outputs.region }}
          image: ${{ needs.production-config.outputs.region }}-docker.pkg.dev/${{ needs.production-config.outputs.gcp_project_id }}/${{ needs.production-config.outputs.artifact_registry_repository }}/${{ needs.production-config.outputs.service_name }}:${{ github.sha }}
          flags: >-
            --service-account=${{ needs.production-config.outputs.runtime_service_account_email }}
            --allow-unauthenticated
          env_vars: |-
            ENVIRONMENT=production
            GOOGLE_CLOUD_PROJECT=${{ needs.production-config.outputs.gcp_project_id }}
            GOOGLE_CLOUD_LOCATION=${{ needs.production-config.outputs.google_cloud_location }}
            GEMINI_MODEL=${{ needs.production-config.outputs.gemini_model }}
            GOOGLE_GENAI_USE_VERTEXAI=${{ needs.production-config.outputs.google_genai_use_vertexai }}
            BIGQUERY_PROJECT=${{ needs.production-config.outputs.gcp_project_id }}
            BIGQUERY_DATASET=${{ needs.production-config.outputs.bigquery_dataset }}
            BIGQUERY_LOCATION=${{ needs.production-config.outputs.bigquery_location }}
            FIREBASE_PROJECT_ID=${{ needs.production-config.outputs.firebase_project_id }}
            FIRESTORE_PROJECT=${{ needs.production-config.outputs.firebase_project_id }}
            FIRESTORE_DATABASE=${{ needs.production-config.outputs.firestore_database }}
            FIRESTORE_COLLECTION=${{ needs.production-config.outputs.firestore_collection }}
            SOURCE_MAX_AGE_DAYS=${{ needs.production-config.outputs.source_max_age_days }}
            ASK_RATE_LIMIT=${{ needs.production-config.outputs.ask_rate_limit }}
            ASK_RATE_WINDOW_SECONDS=${{ needs.production-config.outputs.ask_rate_window_seconds }}
            LOG_LEVEL=${{ needs.production-config.outputs.log_level }}
            AUTH_COOKIE_SECURE=${{ needs.production-config.outputs.auth_cookie_secure }}
            AUTH_COOKIE_SAMESITE=${{ needs.production-config.outputs.auth_cookie_samesite }}
            CORS_ORIGINS=${{ needs.production-config.outputs.cors_origins }}
          secrets: |-
            CSRF_SECRET=bankwise-csrf-secret:latest

  # -----------------------------------------------
  # 5. Deploy frontend after backend deployment
  # -----------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs:
      - backend-ci
      - frontend-ci
      - frontend-production-build
      - deploy-backend
      - production-config

    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ needs.production-config.outputs.deploy_service_account_email }}
          project_id: ${{ needs.production-config.outputs.gcp_project_id }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Download static frontend build
        uses: actions/download-artifact@v4
        with:
          name: bankwise-frontend-static
          path: frontend/out/

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0

      - name: Deploy frontend to Firebase Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project "${{ needs.production-config.outputs.firebase_project_id }}" \
            --non-interactive
